[package]
name = "wb-platform"
description = "Workboard OS integration: config folder, opening files and URLs, process trees, credential store"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
dirs = "6"
# Papelera del sistema (borrar notas sin perderlas).
trash = "5.4.0"

[lints]
workspace = true

# Almacén de credenciales del sistema (secretos de los trackers).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
# DPAPI (solo para leer los PATs de la v1 al migrar): wrapper seguro, sin `unsafe` en este crate.
windows-dpapi = "0.2"
base64 = "0.23.1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3.6.3", features = ["async-secret-service", "async-io", "crypto-rust"] }
