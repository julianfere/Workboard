[package]
name = "wb-sessions"
description = "Workboard agent sessions: registry, agent command lines, embedded terminals and CLI hooks"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dunce = "1"
portable-pty = "0.9"
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1_smol = "1"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
wb-core.workspace = true
wb-i18n.workspace = true
wb-mcp = { path = "../wb-mcp", default-features = false }
wb-platform.workspace = true

[lints]
workspace = true
