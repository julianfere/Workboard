[package]
name = "wb-mcp"
description = "Workboard MCP server: agents read and update the state of their work items"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "wb-mcp"
path = "src/main.rs"
required-features = ["server"]

[features]
default = ["server"]
# El transporte MCP (stdio). Sin él queda la lógica de las herramientas y el contexto de sesión, que usa la app.
server = ["dep:anyhow", "dep:rmcp", "dep:schemars", "dep:tokio"]

[dependencies]
anyhow = { version = "1", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
indexmap = { version = "2", features = ["serde"] }
rmcp = { version = "3.11", features = ["server", "transport-io", "macros"], optional = true }
regex.workspace = true
schemars = { version = "1", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"], optional = true }
wb-core.workspace = true
wb-i18n.workspace = true
wb-platform.workspace = true

[dev-dependencies]
dunce = "1"

[lints]
workspace = true
