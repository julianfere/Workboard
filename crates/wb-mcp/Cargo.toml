[package]
name = "wb-mcp"
description = "Workboard MCP server: agents read and update the state of their work items"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "wb-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
indexmap = { version = "2", features = ["serde"] }
rmcp = { version = "3.11", features = ["server", "transport-io", "macros"] }
schemars = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std"] }
wb-core.workspace = true
wb-i18n.workspace = true
wb-platform.workspace = true

[dev-dependencies]
dunce = "1"
regex.workspace = true

[lints]
workspace = true
