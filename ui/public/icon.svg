<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Icono de Workboard: tablero kanban de 3 columnas sobre naranja coral (distinto de los azules y violetas
       habituales de la barra de tareas). Mismo diseño que assets/make_icon.py. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a2e"/>
      <stop offset="1" stop-color="#e8361c"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <g fill="#fff">
    <rect x="44" y="48" width="48" height="160" rx="14"/>
    <rect x="104" y="48" width="48" height="112" rx="14"/>
    <rect x="164" y="48" width="48" height="68" rx="14"/>
  </g>
</svg>
