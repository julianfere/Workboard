<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Spike terminal</title>
  <link rel="stylesheet" href="xterm.css">
  <style>
    html, body { margin: 0; height: 100%; background: #1e1e1e; color: #ddd; font: 13px system-ui, sans-serif; }
    body { display: flex; flex-direction: column; }
    #bar { display: flex; gap: 8px; align-items: center; padding: 6px 8px; background: #252526; }
    #bar button { background: #3a3d41; color: #ddd; border: 0; padding: 4px 10px; border-radius: 4px; cursor: pointer; }
    #status { margin-left: auto; opacity: .8; }
    #term { flex: 1; min-height: 0; padding: 4px; }
  </style>
</head>
<body>
  <div id="bar">
    <button id="b-default">Comando inicial</button>
    <button id="b-cmd">cmd.exe</button>
    <button id="b-bench">Bench: dir /s System32</button>
    <span id="status"></span>
  </div>
  <div id="term"></div>
  <script src="xterm.js"></script>
  <script src="addon-fit.js"></script>
  <script>
    const { invoke, Channel } = window.__TAURI__.core;
    const status = (t) => (document.getElementById('status').textContent = t);
    const term = new Terminal({ fontFamily: 'Cascadia Mono, Consolas, monospace', fontSize: 14, scrollback: 10000, allowProposedApi: true });
    const fit = new FitAddon.FitAddon();
    term.loadAddon(fit);
    term.open(document.getElementById('term'));
    fit.fit();

    let current = null, cfg = null;

    async function run(cmd, label) {
      if (current !== null) await invoke('kill', { id: current });
      term.reset();
      const onData = new Channel();
      const onExit = new Channel();
      let bytes = 0, msgs = 0;
      const t0 = performance.now();
      const s = (t) => ((t - t0) / 1000).toFixed(2);
      onData.onmessage = (data) => { const u = new Uint8Array(data); bytes += u.length; msgs++; term.write(u); };
      onExit.onmessage = (code) => {
        // Llegada (el proceso terminó y llegó todo por IPC) vs dibujado (xterm vació su cola).
        const tExit = performance.now();
        term.write('', () => status(`${label}: salió con ${code} · ${(bytes / 1024).toFixed(0)} KB en ${msgs} mensajes · llegó todo a los ${s(tExit)} s · dibujado a los ${s(performance.now())} s`));
        current = null;
      };
      current = await invoke('spawn', { cmd, cwd: cfg.cwd, cols: term.cols, rows: term.rows, onData, onExit });
      status(`${label}: corriendo (${cmd.join(' ')})`);
      term.focus();
    }

    term.onData((d) => current !== null && invoke('write', { id: current, data: d }));
    term.onResize(({ cols, rows }) => current !== null && invoke('resize', { id: current, cols, rows }));
    new ResizeObserver(() => fit.fit()).observe(document.getElementById('term'));

    document.getElementById('b-default').onclick = () => run(cfg.cmd, 'inicial');
    document.getElementById('b-cmd').onclick = () => run(['cmd.exe'], 'cmd');
    document.getElementById('b-bench').onclick = () => run(['cmd', '/c', 'dir', '/s', 'C:\\Windows\\System32'], 'bench');

    invoke('config').then((c) => { cfg = c; run(cfg.cmd, 'inicial'); });
  </script>
</body>
</html>
