[package]
name = "spike-terminal"
version = "0.0.0"
edition = "2021"
publish = false
default-run = "spike-terminal"

[dependencies]
tauri = { version = "2", features = [] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[[bin]]
name = "spike-terminal"
path = "src/main.rs"

[[bin]]
name = "pty-bench"
path = "src/bench.rs"

[profile.release]
opt-level = 3
